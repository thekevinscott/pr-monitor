name: 'PR Monitor'
description: 'Predicts the workflow runs a PR will produce and gates on that exact set completing'
author: 'thekevinscott'

inputs:
  github-token:
    description: >-
      GitHub token for API access. Needs `contents: read`, `actions: read`, and
      `pull-requests: read`.
    required: false
    default: ${{ github.token }}
  resolve-outputs:
    description: >-
      Resolver commands, one per line. Each line is trimmed (blank lines are
      dropped) and passed to willfire as one `--callback "<command>"`: a command
      whose stdout is a JSON map answering job outputs the sandbox cannot
      compute (thekevinscott/willfire#153).
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      run: |
        pm=$(node -p "require('${{ github.action_path }}/package.json').packageManager")
        v="${pm#pnpm@}"
        echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Setup Node 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install runtime dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --prod --frozen-lockfile --prefer-offline

    - name: Run monitor
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_MONITOR_RESOLVE_OUTPUTS: ${{ inputs.resolve-outputs }}
      run: ./node_modules/.bin/tsx src/entry.ts

branding:
  icon: 'check-circle'
  color: 'green'
