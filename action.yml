name: 'PR Monitor'
description: 'Predicts the workflow runs a PR will produce and gates on that exact set completing'
author: 'thekevinscott'

inputs:
  github-token:
    description: >-
      GitHub token for API access. Needs `contents: read`, `actions: read`, and
      `pull-requests: read`.
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      # Under local use (`uses: ./`) `github.action_path` ends in `/.`, which
      # pnpm/action-setup's `package_json_file` read cannot handle. Node normalizes it.
      run: |
        pm=$(node -p "require('${{ github.action_path }}/package.json').packageManager")
        v="${pm#pnpm@}"
        echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Setup Node 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        # No pnpm store cache: cache-dependency-path rejects the `/.` local use carries.

    - name: Install runtime dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --prod --frozen-lockfile --prefer-offline

    - name: Run monitor
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ./node_modules/.bin/tsx src/entry.ts

branding:
  icon: 'check-circle'
  color: 'green'
