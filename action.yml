name: 'PR Monitor'
description: 'Predicts the workflow runs a PR will produce and gates on that exact set completing'
author: 'thekevinscott'

inputs:
  github-token:
    description: >-
      GitHub token for API access. Needs `contents: read`, `actions: read`, and
      `pull-requests: read`.
    required: false
    default: ${{ github.token }}
  execute:
    description: >-
      Jobs willfire may execute to resolve a dynamic matrix, as
      whitespace-separated grants of the form `owner/repo:job1,job2`, where
      `owner/repo` is the repo the workflow *file* lives in — for a reusable
      workflow, the callee. The granted job's steps run for real at the
      predicted commit, so grant only jobs whose code you trust. Empty grants
      nothing.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      # When the action is consumed locally (`uses: ./`, e.g. this repo dogfooding
      # itself), `github.action_path` ends in `/.`, which breaks pnpm/action-setup's
      # `package_json_file` read ("No pnpm version is specified"). Resolve the version
      # via Node (which normalizes the path) and pass it explicitly instead.
      run: |
        pm=$(node -p "require('${{ github.action_path }}/package.json').packageManager")
        v="${pm#pnpm@}"
        echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Setup Node 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        # No pnpm store cache: setup-node's cache-dependency-path rejects the `/.`
        # that `github.action_path` carries under local (`./`) use, and the action's
        # lockfile lives outside the consumer's workspace anyway.

    - name: Install runtime dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --prod --frozen-lockfile --prefer-offline

    - name: Run monitor
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_MONITOR_EXECUTE: ${{ inputs.execute }}
      run: ./node_modules/.bin/tsx src/entry.ts

branding:
  icon: 'check-circle'
  color: 'green'
