name: 'PR Monitor'
description: 'Predicts the workflow runs a PR will produce and gates on that exact set completing'
author: 'thekevinscott'

inputs:
  github-token:
    description: >-
      GitHub token for API access. Needs `contents: read`, `actions: read`, and
      `pull-requests: read`.
    required: false
    default: ${{ github.token }}
  execute:
    description: >-
      Whether willfire may execute jobs to resolve a dynamic matrix. `true`
      turns execution on for the whole prediction; `false`, the default,
      executes nothing.

      There is no narrower setting, and no way to name a repo or a job. willfire
      0.1.31 removed per-repo and per-job grants: its executor runs in a docker
      sandbox, in this PR's own repo, at the predicted commit. So `true` permits
      every job the prediction reaches to run its PR-authored steps for real.
      Set it on the basis of the whole workflow set, not one job in it.

      The retired `owner/repo:job1,job2` spelling is still accepted and still
      means `true`, with a warning saying that neither half of it scoped
      anything. Any other value fails the gate, named.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm version
      id: pnpm-version
      shell: bash
      # When the action is consumed locally (`uses: ./`, e.g. this repo dogfooding
      # itself), `github.action_path` ends in `/.`, which breaks pnpm/action-setup's
      # `package_json_file` read ("No pnpm version is specified"). Resolve the version
      # via Node (which normalizes the path) and pass it explicitly instead.
      run: |
        pm=$(node -p "require('${{ github.action_path }}/package.json').packageManager")
        v="${pm#pnpm@}"
        echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Setup Node 24
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        # No pnpm store cache: setup-node's cache-dependency-path rejects the `/.`
        # that `github.action_path` carries under local (`./`) use, and the action's
        # lockfile lives outside the consumer's workspace anyway.

    - name: Install runtime dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --prod --frozen-lockfile --prefer-offline

    - name: Run monitor
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_MONITOR_EXECUTE: ${{ inputs.execute }}
      run: ./node_modules/.bin/tsx src/entry.ts

branding:
  icon: 'check-circle'
  color: 'green'
