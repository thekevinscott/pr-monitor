name: e2e

# Live against GitHub, so it gates nothing. A red here is a finding, not a flake.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: willfire e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter willfire run test:e2e
      - name: Report failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_OWNER: ${{ github.repository_owner }}
          E2E_REPO: ${{ github.event.repository.name }}
          E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm run e2e-report
