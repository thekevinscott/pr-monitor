name: Testing Conventions

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packages/willfire/**'
      - '!packages/willfire/*.md'
      - 'action.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'vitest.config.mts'
      - 'stryker.config.json'
      - 'testing-conventions.toml'
      - '.github/workflows/testing-conventions.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packages/willfire/**'
      - '!packages/willfire/*.md'
      - 'action.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'vitest.config.mts'
      - 'stryker.config.json'
      - 'testing-conventions.toml'
      - '.github/workflows/testing-conventions.yml'

permissions:
  contents: read

jobs:
  conventions:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: src
      config: testing-conventions.toml
