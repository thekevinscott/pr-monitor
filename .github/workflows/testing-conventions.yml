name: Testing Conventions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: src
      config: testing-conventions.toml
      gates: '["colocated-test", "unit-lint", "unit-coverage", "mutation", "integration-lint", "e2e-verify"]'
