name: Testing Conventions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    # thekevinscott/testing-conventions reusable workflow: enforces colocated unit
    # tests and the unit-suite coverage floor (vitest v8) for the TypeScript sources
    # under src/. Thresholds and exemptions live in testing-conventions.toml.
    # The TypeScript coverage job installs deps with pnpm — already this repo's
    # package manager. Set `version:` to freeze the tool for reproducible runs;
    # left unset it tracks the latest published release.
    uses: thekevinscott/testing-conventions/.github/workflows/testing-conventions.yml@v0
    with:
      languages: '["typescript"]'
      source: src
      config: testing-conventions.toml
      # `@v0` is rolling, so new gates arrive on their own. Name the ones that apply
      # here rather than take every gate the tool grows; each omission is a fact about
      # this repo, not a waiver of a failing check. Diff-scoped variants ride along —
      # colocated-test brings co-change, unit-coverage brings the changed-line job.
      #
      # Left out: packaging — the action runs `tsx src/entry.ts` from source, so there
      # is no built artifact to inspect.
      gates: '["colocated-test", "unit-lint", "unit-coverage", "mutation", "integration-lint", "e2e-verify"]'
