name: Promote v1 tag

on:
  workflow_run:
    # Every workflow that runs on push to `main` belongs here, or `v1` never advances.
    workflows:
      - Tests
      - Testing Conventions
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-v1
  cancel-in-progress: false

jobs:
  promote:
    name: Promote v1
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Promote v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTE_OWNER: ${{ github.repository_owner }}
          PROMOTE_REPO: ${{ github.event.repository.name }}
          PROMOTE_SHA: ${{ github.event.workflow_run.head_sha }}
          PROMOTE_TAG: v1
        run: pnpm run promote
