name: PR Monitor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  monitor:
    name: 'CI Gate'
    runs-on: ubuntu-latest
    # The action has no timeout of its own; this is the backstop.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          execute: true
